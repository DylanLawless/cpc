[package]
name = "copy-code-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Copy files and directories to the clipboard for AI, with filename headers and local token counts"
license = "MIT"
readme = "README.md"
keywords = ["clipboard", "cli", "code", "tokens", "llm"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "cpc"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
dirs = "5.0"
globset = "0.4"
ignore = "0.4"
serde = { version = "1.0", features = ["derive"] }
tiktoken-rs = "0.6"
toml = "0.8"

[target.'cfg(windows)'.dependencies]
clipboard-win = "5.4"

[dev-dependencies]
tempfile = "3.10"
